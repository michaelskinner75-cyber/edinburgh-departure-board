<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Edinburgh Bus Station — Stagecoach Departures</title><style>body{margin:0;background:#071018;color:#f2f7fb;font-family:system-ui,-apple-system,sans-serif}header{padding:14px;position:sticky;top:0;z-index:5;background:#071018f7;border-bottom:1px solid #203345}h1{font-size:20px;margin:0}.sub{color:#9fb0bf;margin-top:4px}.clock{float:right;color:#ffc94d;font-size:22px;font-weight:900}.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button,a{background:#0d1924;color:white;border:1px solid #203345;border-radius:9px;padding:10px;font-weight:800;text-decoration:none}.station{background:#123d33}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.card{background:#0d1924;border:1px solid #203345;border-radius:11px;padding:10px}.card b{display:block;font-size:20px}.card span{color:#9fb0bf;font-size:12px}.notice{margin:0 10px 10px;padding:12px;border:1px solid #203345;border-radius:10px;background:#0d1924;color:#9fb0bf}.warn{color:#ffc94d}.ok{color:#58d68d}main{padding:0 8px;overflow-x:auto}table{width:100%;min-width:980px;border-spacing:0 6px}th{text-align:left;color:#9fb0bf;font-size:12px;padding:0 8px}td{background:#0d1924;padding:9px;border-top:1px solid #203345;border-bottom:1px solid #203345;vertical-align:middle}.time,.svc,.stance{font-weight:900;font-size:18px}.time{color:#ffc94d}.map{background:#153d5c}.mark{background:#183722}.overdue{opacity:.72}.entry{width:130px;max-width:22vw;box-sizing:border-box;background:#071018;color:#fff;border:1px solid #36546c;border-radius:8px;padding:9px;font-size:14px}.entry:focus{outline:2px solid #ffc94d;border-color:#ffc94d}.saved{border-color:#459679;background:#0d2922}.stagecoachTag{display:inline-block;background:#f3a51b;color:#071018;font-size:10px;font-weight:900;padding:3px 6px;border-radius:999px;margin-left:5px}@media(max-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.card{padding:8px}.card b{font-size:17px}.entry{width:120px;max-width:none}table{min-width:930px}}</style></head><body><header><span class="clock" id="clock">--:--:--</span><h1>EDINBURGH BUS STATION — STAGECOACH</h1><div class="sub" id="dateLine">Loading…</div><div class="bar"><button id="showBtn">Show marked</button><button id="refreshBtn">Refresh departures</button><a class="station" href="https://bustimes.org/stations/620G600739" target="_blank">BusTimes Station</a></div></header><div class="cards"><div class="card"><b id="remaining">—</b><span>unmarked Stagecoach departures</span></div><div class="card"><b id="nextTime">—</b><span>next scheduled</span></div><div class="card"><b id="updated">—</b><span>feed updated</span></div></div><div class="notice" id="notice">Loading Stagecoach timetable…</div><main><table><thead><tr><th>TIME</th><th>SERVICE</th><th>DESTINATION</th><th>STANCE</th><th>FLEET</th><th>DRIVER</th><th>LIVE</th><th>MAP</th><th>CHECKED</th></tr></thead><tbody id="body"></tbody></table></main><script>let data=null,showMarked=false;const $=x=>document.getElementById(x),pad=x=>String(x).padStart(2,'0');const STAGECOACH=new Set(['X55','X56','X58','X59','X59A','X60','X60A','X61']);function cleanService(v){return String(v||'').trim().toUpperCase()}function isStagecoach(x){return STAGECOACH.has(cleanService(x.service))}function rowId(x){return [data.service_date,x.date,x.time,cleanService(x.service),x.stance||''].join('|')}function marks(){try{return JSON.parse(localStorage.getItem('edi-marks-'+data.service_date)||'{}')}catch(e){return{}}}function saveMarks(m){localStorage.setItem('edi-marks-'+data.service_date,JSON.stringify(m))}function entries(){try{return JSON.parse(localStorage.getItem('edi-entries-'+data.service_date)||'{}')}catch(e){return{}}}function saveEntries(e){localStorage.setItem('edi-entries-'+data.service_date,JSON.stringify(e))}function minutes(x){let [h,m]=x.time.split(':').map(Number);let day=x.date===data.service_date?0:1;return day*1440+h*60+m}function nowMinutes(){let n=new Date();return n.getHours()*60+n.getMinutes()}function allStagecoach(){const seen=new Map();[...(data.schedule||[]),...(data.live||[])].filter(isStagecoach).forEach(x=>{const k=[x.date,x.time,cleanService(x.service),x.stance||''].join('|');if(!seen.has(k))seen.set(k,{...x});else seen.set(k,{...seen.get(k),...x});});return [...seen.values()].sort((a,b)=>minutes(a)-minutes(b)||cleanService(a.service).localeCompare(cleanService(b.service)))}function liveFor(x){return (data.live||[]).find(v=>cleanService(v.service)===cleanService(x.service)&&v.time===x.time&&v.date===x.date)}function escAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){const m=marks(),e=entries(),now=nowMinutes(),all=allStagecoach(),rows=all.filter(x=>showMarked||!m[rowId(x)]),un=all.filter(x=>!m[rowId(x)]);$('remaining').textContent=un.length;const future=un.filter(x=>minutes(x)>=now);$('nextTime').textContent=future.length?future[0].time:'—';$('body').innerHTML=rows.map(x=>{const k=rowId(x),l=liveFor(x),url=(l&&l.trip_url)||x.trip_url||x.route_url||'https://bustimes.org/stations/620G600739',en=e[k]||{};return '<tr class="'+(minutes(x)<now?'overdue':'')+'"><td class="time">'+x.time+'</td><td class="svc">'+cleanService(x.service)+'<span class="stagecoachTag">SC</span></td><td>'+escAttr(x.to||'—')+'</td><td class="stance">'+escAttr(x.stance||'—')+'</td><td><input class="entry '+(en.fleet?'saved':'')+'" inputmode="numeric" autocomplete="off" placeholder="Fleet no." value="'+escAttr(en.fleet||'')+'" data-k="'+escAttr(k)+'" data-f="fleet"></td><td><input class="entry '+(en.driver?'saved':'')+'" autocomplete="off" placeholder="Driver name / no." value="'+escAttr(en.driver||'')+'" data-k="'+escAttr(k)+'" data-f="driver"></td><td>'+(l&&l.expected?'<b class="ok">'+escAttr(l.expected)+'</b>':'—')+'</td><td><a class="map" href="'+escAttr(url)+'" target="_blank">MAP</a></td><td><button class="mark" onclick="toggleMark(\''+k.replace(/'/g,"\\'")+'\')">'+(m[k]?'UNDO':'MARK')+'</button></td></tr>'}).join('')||'<tr><td colspan="9">No Stagecoach departures found in the current feed.</td></tr>'}window.toggleMark=k=>{let m=marks();m[k]?delete m[k]:m[k]=Date.now();saveMarks(m);render()};document.addEventListener('input',ev=>{const el=ev.target.closest('.entry');if(!el)return;const e=entries(),k=el.dataset.k,f=el.dataset.f;e[k]=e[k]||{};e[k][f]=el.value.trim();if(!e[k].fleet&&!e[k].driver)delete e[k];saveEntries(e);el.classList.toggle('saved',!!el.value.trim())});async function getJSON(file){let r=await fetch(file+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(file);return r.json()}async function load(){try{data=await getJSON('live.json');$('notice').innerHTML='<b class="ok">STAGECOACH FEED ACTIVE.</b> Scheduled departures are shown with editable fleet and driver fields.';$('updated').textContent=(data.generated_at||'').slice(11,16)||'LIVE'}catch(e){try{data=await getJSON('fallback.json');$('notice').innerHTML='<b class="warn">TIMETABLE FALLBACK ACTIVE.</b> Scheduled Stagecoach departures remain available.';$('updated').textContent='FALLBACK'}catch(e2){$('notice').textContent='Unable to load timetable.';return}}$('dateLine').textContent=new Date(data.service_date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' • Stagecoach departures';render()}function tick(){let n=new Date();$('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds())}showBtn.onclick=()=>{showMarked=!showMarked;showBtn.textContent=showMarked?'Hide marked':'Show marked';render()};refreshBtn.onclick=load;tick();setInterval(tick,1000);load();setInterval(load,60000)</script></body></html>
