<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Edinburgh Bus Station Live</title><style>body{margin:0;background:#071018;color:#f2f7fb;font-family:system-ui,-apple-system,sans-serif}header{padding:14px;position:sticky;top:0;background:#071018f5;border-bottom:1px solid #203345}h1{font-size:20px;margin:0}.sub{color:#9fb0bf;margin-top:4px}.clock{float:right;color:#ffc94d;font-size:22px;font-weight:900}.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button,a{background:#0d1924;color:white;border:1px solid #203345;border-radius:9px;padding:10px;font-weight:800;text-decoration:none}.station{background:#123d33}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.card{background:#0d1924;border:1px solid #203345;border-radius:11px;padding:10px}.card b{display:block;font-size:20px}.card span{color:#9fb0bf;font-size:12px}.notice{margin:0 10px 10px;padding:12px;border:1px solid #203345;border-radius:10px;background:#0d1924;color:#9fb0bf}.warn{color:#ffc94d}.ok{color:#58d68d}main{padding:0 8px;overflow-x:auto}table{width:100%;min-width:650px;border-spacing:0 6px}th{text-align:left;color:#9fb0bf;font-size:12px}td{background:#0d1924;padding:10px;border-top:1px solid #203345;border-bottom:1px solid #203345}.time,.svc,.stance{font-weight:900;font-size:18px}.time{color:#ffc94d}.map{background:#153d5c}.mark{background:#183722}.overdue{opacity:.8}</style></head><body><header><span class="clock" id="clock">--:--:--</span><h1>EDINBURGH BUS STATION — LIVE</h1><div class="sub" id="dateLine">Loading…</div><div class="bar"><button id="showBtn">Show marked</button><button id="refreshBtn">Refresh live</button><a class="station" href="https://bustimes.org/stations/620G600739" target="_blank">BusTimes Station</a></div></header><div class="cards"><div class="card"><b id="remaining">—</b><span>unmarked</span></div><div class="card"><b id="nextTime">—</b><span>next scheduled</span></div><div class="card"><b id="updated">—</b><span>feed updated</span></div></div><div class="notice" id="notice">Loading timetable…</div><main><table><thead><tr><th>TIME</th><th>SERVICE</th><th>DESTINATION</th><th>STANCE</th><th>LIVE</th><th>MAP</th><th></th></tr></thead><tbody id="body"></tbody></table></main><script>let data=null,showMarked=false;const $=x=>document.getElementById(x),pad=x=>String(x).padStart(2,'0');function key(x,i){return data.service_date+'|'+x.date+'|'+x.time+'|'+x.service+'|'+i}function marks(){try{return JSON.parse(localStorage.getItem('edi-marks-'+data.service_date)||'{}')}catch(e){return{}}}function save(m){localStorage.setItem('edi-marks-'+data.service_date,JSON.stringify(m))}function minutes(x){let [h,m]=x.time.split(':').map(Number);let day=x.date===data.service_date?0:1;return day*1440+h*60+m}function nowMinutes(){let n=new Date();return n.getHours()*60+n.getMinutes()}function render(){let m=marks(),now=nowMinutes(),rows=data.schedule.map((x,i)=>({x,i,k:key(x,i)})).filter(r=>showMarked||!m[r.k]);let un=data.schedule.map((x,i)=>({x,i})).filter(r=>!m[key(r.x,r.i)]);$('remaining').textContent=un.length;let future=un.filter(r=>minutes(r.x)>=now);$('nextTime').textContent=future.length?future[0].x.time:'—';$('body').innerHTML=rows.map(r=>{let x=r.x,l=(data.live||[]).find(v=>v.service===x.service&&v.time===x.time),url=(l&&l.trip_url)||x.trip_url||x.route_url||'https://bustimes.org/stations/620G600739';return '<tr class="'+(minutes(x)<now?'overdue':'')+'"><td class="time">'+x.time+'</td><td class="svc">'+x.service+'</td><td>'+x.to+'</td><td class="stance">'+(x.stance||'—')+'</td><td>'+(l&&l.expected?'<b class="ok">'+l.expected+'</b>':'—')+'</td><td><a class="map" href="'+url+'" target="_blank">MAP</a></td><td><button class="mark" onclick="toggle(\''+r.k+'\')">'+(m[r.k]?'UNDO':'MARK')+'</button></td></tr>'}).join('')}window.toggle=k=>{let m=marks();m[k]?delete m[k]:m[k]=Date.now();save(m);render()};async function getJSON(file){let r=await fetch(file+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(file);return r.json()}async function load(){try{data=await getJSON('live.json');$('notice').innerHTML='<b class="ok">LIVE FEED ACTIVE.</b> Schedule and live information loaded automatically.';$('updated').textContent=(data.generated_at||'').slice(11,16)||'LIVE'}catch(e){try{data=await getJSON('fallback.json');$('notice').innerHTML='<b class="warn">TIMETABLE FALLBACK ACTIVE.</b> Live updater is unavailable, but scheduled departures, stances and map links remain usable.';$('updated').textContent='FALLBACK'}catch(e2){$('notice').textContent='Unable to load timetable.';return}}$('dateLine').textContent=new Date(data.service_date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' • 12:00–00:30';render()}function tick(){let n=new Date();$('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds())}showBtn.onclick=()=>{showMarked=!showMarked;showBtn.textContent=showMarked?'Hide marked':'Show marked';render()};refreshBtn.onclick=load;tick();setInterval(tick,1000);load();setInterval(load,60000)</script></body></html>
