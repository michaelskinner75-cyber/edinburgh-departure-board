name: Update Edinburgh live departures

on:
  push:
    paths:
      - 'update_live.py'
      - '.github/workflows/update-live.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python update_live.py
      - name: Commit live data
        run: |
          git config user.name "edinburgh-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Edinburgh departures"
          git push
